n the same foundation</text><rect width="560" height="170" x="715" y="470" fill="#173a6b" stroke="#4a8fe0" stroke-width="1.5" rx="14"/><text x="735" y="498" fill="#fff" font-size="17" font-weight="700">Infrastructure layer (the foundation)</text><text x="735" y="519" fill="#a9c7ec" font-size="14">Bicep now lives in the repo — no more submodule</text><g fill="#e6edf7" font-size="13" font-weight="600"><rect width="100" height="40" x="735" y="536" fill="#23518f" rx="8"/><text x="785" y="561" text-anchor="middle">Networking</text><rect width="100" height="40" x="843" y="536" fill="#23518f" rx="8"/><text x="893" y="561" text-anchor="middle">Identity</text><rect width="100" height="40" x="951" y="536" fill="#23518f" rx="8"/><text x="1001" y="561" text-anchor="middle">Foundry</text><rect width="90" height="40" x="1059" y="536" fill="#23518f" rx="8"/><text x="1104" y="561" text-anchor="middle">Data</text><rect width="98" height="40" x="1157" y="536" fill="#23518f" rx="8"/><text x="1206" y="561" text-anchor="middle">Monitoring</text></g><text x="735" y="608" fill="#a9c7ec" font-size="13">Terraform stays in its AVM module, kept in parity by automated sync + human review.</text><text x="735" y="628" fill="#a9c7ec" font-size="13">bicep-ptn-aiml-landing-zone: notice pointing here, no new development.</text><text x="1300" y="284" fill="#fff" font-size="17" font-weight="700">Choose what to deploy</text><rect width="235" height="150" x="1300" y="302" fill="#0f2a50" stroke="#7cc4ff" stroke-width="2" rx="12"/><text x="1318" y="332" fill="#7cc4ff" font-size="16" font-weight="700">① Infra + application</text><text x="1318" y="354" fill="#e6edf7" font-size="13">Default. Full working</text><text x="1318" y="372" fill="#e6edf7" font-size="13">agent app, classic or</text><text x="1318" y="390" fill="#e6edf7" font-size="13">Foundry hosted agent.</text><text x="1318" y="428" fill="#a9c7ec" font-size="12">Available in the preview</text><rect width="235" height="170" x="1300" y="470" fill="#0f